[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foldrive"
version = "0.1.0"
description = "Pair any local folder with any Google Drive folder - git-style two-way sync"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Udbhav Sai" }]
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "send2trash>=1.8",
    "platformdirs>=4.0",
]

[project.scripts]
foldrive = "foldrive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
