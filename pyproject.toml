[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foldrive"
dynamic = ["version"]
description = "Pair any local folder with any Google Drive folder - git-style two-way sync"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Udbhav Sai", email = "udbhavsai.k@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["google-drive", "sync", "cli", "backup"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
    "send2trash>=1.8",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.urls]
Homepage = "https://github.com/udbhav07/foldrive"
Issues = "https://github.com/udbhav07/foldrive/issues"
Changelog = "https://github.com/udbhav07/foldrive/blob/main/CHANGELOG.md"

[project.scripts]
foldrive = "foldrive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "foldrive.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["slow: randomized/property tests, excluded from PR runs"]
